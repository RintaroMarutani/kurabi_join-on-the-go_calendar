name: Monitor events.json freshness

# 公開中の events.json が「配信元(GAS API)の現在値と一致しているか」を毎時チェックする。
#
# 判定を「今日以降のイベントがあるか」にすると、開催予定が飛び飛びの期間（3日先まで予定が
# 無い等）に誤検知するため、"公開物 == 配信元" の突合に変更している。
# この1つの比較で、過去に起きた両方の故障モードを検知できる:
#   - Pages デプロイのスタック（main は新しいのに公開ファイルが古い）
#   - GAS トリガー停止（配信元が更新されない）
# 予定が0件でも、公開物と配信元が一致していれば正常とみなす。
#
# 反映には GAS トリガー(10分間隔)＋デプロイの時間差があるため、不一致時は間隔を空けて再確認し、
# 伝播待ちによる誤検知を避ける。

on:
  schedule:
    - cron: '0 * * * *'   # 毎時0分（UTC）
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Compare published events.json against the source API
        shell: bash
        env:
          API_ENDPOINT: https://script.google.com/macros/s/AKfycbx8sv9TegLDV3F-hscGKKX_oJra3zzgtVqyickaRallZRlceXjA67V2i_oRI0FY-NWd/exec
          PUBLISHED_URL: https://calendar.kurabi-japan.com/events.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.request

          API = os.environ['API_ENDPOINT'] + '?days=3'
          PUB = os.environ['PUBLISHED_URL']
          ATTEMPTS = 3          # 不一致時の再確認回数
          WAIT_SEC = 300        # 再確認までの待ち（GASトリガー10分間隔をまたぐため）

          def get(url):
              req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))

          def norm(payload):
              """比較用に data 配列だけを正規化した文字列にする"""
              return json.dumps(payload.get('data', []), sort_keys=True, ensure_ascii=False)

          for attempt in range(1, ATTEMPTS + 1):
              try:
                  api = get(API)
              except Exception as e:
                  print(f"::error::Source API unreachable: {e}")
                  sys.exit(1)

              if api.get('success') is not True:
                  print(f"::error::Source API returned failure: {api.get('error')}")
                  sys.exit(1)

              try:
                  pub = get(PUB + f'?cb={int(time.time())}')
              except Exception as e:
                  print(f"::error::Published events.json unreachable: {e}")
                  sys.exit(1)

              if norm(api) == norm(pub):
                  print(f"OK: published matches source ({api.get('count')} event(s) in the next 3 days).")
                  sys.exit(0)

              print(f"[attempt {attempt}/{ATTEMPTS}] mismatch — "
                    f"source={api.get('count')} published={pub.get('count')}")
              if attempt < ATTEMPTS:
                  print(f"  waiting {WAIT_SEC}s for propagation...")
                  time.sleep(WAIT_SEC)

          print("::error::Published events.json does NOT match the source after retries. "
                "The pipeline is likely stuck — check the 'Deploy to GitHub Pages' runs "
                "(concurrency group must be 'pages-deploy') and the GAS prewarmCache trigger.")
          sys.exit(1)
          PY
